<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurse's board · Ghar Bhet</title>
<meta name="description" content="The ANM's view: open referrals arriving live from ASHAs' spoken visits, who is due a home visit today, and the village register.">
<meta name="theme-color" content="#f4f1e8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:image" content="/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .b-wrap { padding-top: 26px; padding-bottom: 48px; }
  .b-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .b-head h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 3.4vw, 42px); margin: 0; line-height: 1.1; }
  .b-head p { margin: 6px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .stat b { display: block; font-family: var(--mono); font-weight: 500; font-size: 34px; line-height: 1.05; }
  .stat span { font-size: 14px; color: var(--ink-2); }
  .stat.hot b { color: var(--refer); }
  .b-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 960px) { .b-grid { grid-template-columns: 1fr; } }
  .col { display: grid; gap: 12px; }
  .col > h2 { font-size: 17px; margin: 0; display: flex; gap: 10px; align-items: center; }
  .ref { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--refer); border-radius: 16px; padding: 14px 16px; position: relative; }
  .ref.seen { border-left-color: var(--line-2); opacity: .78; }
  .ref.arrive { animation: arrive 1.2s ease-out; }
  @keyframes arrive { 0% { transform: translateY(-8px); box-shadow: 0 0 0 4px var(--refer-soft); } 100% { transform: none; box-shadow: none; } }
  .ref h3 { margin: 0 0 4px; font-family: var(--serif); font-size: 21px; font-weight: 600; }
  .ref ul { margin: 6px 0 10px; padding-left: 18px; font-size: 15px; color: var(--ink-2); }
  .ref .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ref .stamp { position: absolute; right: 14px; top: 12px; font-size: 13px; }
  .due { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 6px; }
  .due-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .due-top b { font-size: 17px; }
  .plan { display: flex; gap: 4px; flex-wrap: wrap; }
  .plan span { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: 999px; background: var(--paper-2); color: var(--ink-3); }
  .plan span.done { background: var(--ok-soft); color: var(--ok); }
  .plan span.due { background: var(--voice); color: var(--voice-ink); font-weight: 600; }
  .plan span.over { background: var(--refer-soft); color: var(--refer); }
  .reg-wrap { margin-top: 28px; }
  .reg-wrap h2 { font-size: 17px; margin: 0 0 10px; }
  .register { overflow-x: auto; }
  .register table { min-width: 680px; }
  .register td.name { font-size: 22px; }
  .register td small { font-family: var(--sans); font-size: 13px; color: var(--ink-3); display: block; }
  .empty { color: var(--ink-3); font-size: 15px; padding: 14px; border: 1px dashed var(--line-2); border-radius: 14px; }
</style>
</head>
<body>
<header id="top"></header>
<main class="wrap b-wrap">
  <div class="b-head">
    <div><h1 id="vname">The nurse's board</h1><p class="muted" id="vmeta">Loading the village register…</p></div>
    <span class="pill" id="live-pill">Connecting…</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="b-grid">
    <section class="col" aria-label="Open referrals"><h2>Referrals from today's visits</h2><div class="col" id="refs"></div></section>
    <section class="col" aria-label="Due today"><h2>Visits due today</h2><p class="faint" style="margin:-6px 0 0">Newborn days follow the 2026 SSBSK schedule: 3, 7, 14, 42, or nine visits for a baby at risk.</p><div class="col" id="due"></div></section>
  </div>
  <section class="reg-wrap" aria-label="Village register">
    <h2>Village register</h2>
    <div class="register"><div class="reg-head"><span id="reg-title">Register</span><span>Last visit and result</span></div><table><thead><tr><th style="width:auto">Name</th><th style="width:auto">Who</th><th style="width:auto">Last visit</th><th style="width:auto">Result</th><th style="width:auto">Visits</th></tr></thead><tbody id="reg"></tbody></table></div>
  </section>
</main>
<footer id="foot"></footer>
<script type="module">
import { mountChrome, api, esc, ago } from "/js/ui.js";
mountChrome("/anm");
const $ = (s) => document.querySelector(s);
let S = null, seenIds = new Set(), firstPaint = true;
const KIND = { baby: "Newborn", pregnant: "Pregnant", mother: "After birth" };
const who = (p) => p.kind === "baby" ? `${esc(p.name)}'s baby` : esc(p.name);
const status = (p) => p.kind === "baby" ? `day ${p.dayOfLife ?? "?"}${p.atRisk ? ", at risk" : ""}` : p.kind === "pregnant" ? `${p.weeks ?? "?"} weeks` : `day ${p.dayAfter ?? "?"} after birth`;

function paint() {
  const t = S.totals;
  $("#vname").textContent = `${S.village.name}: the nurse's board`;
  $("#vmeta").textContent = `${S.village.block}${S.village.sample ? ". The people here are made-up samples; visits you speak on the visit page are added live." : ""}`;
  $("#stats").innerHTML = [[t.openReferrals, "open referrals", t.openReferrals ? "hot" : ""], [t.highRisk, "at risk after their last visit", ""], [t.dueToday, "visits due today", ""], [t.visitsThisWeek, "visits this week", ""]]
    .map(([n, l, c]) => `<div class="stat ${c}"><b>${n}</b><span>${l}</span></div>`).join("");
  // referrals
  const refs = S.referrals.slice(0, 12);
  $("#refs").innerHTML = refs.length ? refs.map((r) => `<article class="ref ${r.status === "seen" ? "seen" : ""} ${!firstPaint && !seenIds.has(r.id) ? "arrive" : ""}">
      ${r.status === "open" ? `<span class="stamp">REFER TODAY</span>` : ""}
      <h3>${r.type === "newborn" ? `${esc(r.name)}'s baby` : esc(r.name)}</h3>
      <p class="faint" style="margin:0">${r.type === "newborn" ? "Newborn visit" : r.type === "anc" ? "Pregnancy visit" : "After birth"} · ${ago(r.at)}${r.sample ? " · sample" : ""}</p>
      <ul>${r.flags.map((f) => `<li><b>${esc(f.title)}.</b> ${esc(f.why)} ${esc(f.action)}</li>`).join("")}</ul>
      <div class="row"><a class="btn small" href="/slip/${r.id}">Referral slip</a>${r.status === "open" ? `<button class="btn small ghost" data-seen="${r.id}">Mark as seen</button>` : `<span class="pill ok">Seen ${r.seenAt ? ago(r.seenAt) : ""}</span>`}</div>
    </article>`).join("") : `<p class="empty">No referrals. When an ASHA's visit finds a danger sign, it appears here at once.</p>`;
  refs.forEach((r) => seenIds.add(r.id));
  $("#refs").querySelectorAll("[data-seen]").forEach((b) => b.addEventListener("click", async () => { b.disabled = true; b.textContent = "Saving…"; try { await api(`/api/referrals/${b.dataset.seen}/seen`, { by: "ANM" }); } catch (e) { b.textContent = e.message; } }));
  // due today
  const due = S.people.filter((p) => p.dueToday).sort((a, b) => (b.atRisk ? 1 : 0) - (a.atRisk ? 1 : 0));
  $("#due").innerHTML = due.length ? due.map((p) => `<div class="due"><div class="due-top"><b>${who(p)}</b><span class="faint">${status(p)}</span></div>
      ${p.plan ? `<div class="plan" aria-label="Visit plan">${p.plan.map((d) => `<span class="${d.done ? "done" : d.due ? "due" : d.overdue ? "over" : ""}">day ${d.day}</span>`).join("")}</div>` : `<p class="faint" style="margin:0">Monthly pregnancy visit${p.last ? `; last ${ago(p.last.at)}` : ""}.</p>`}
      ${p.last?.refer ? `<span class="pill refer">Referred after last visit</span>` : p.last?.watch ? `<span class="pill watch">Watch</span>` : ""}
      <a class="btn small ghost" href="/visit?type=${p.kind === "baby" ? "newborn" : p.kind === "pregnant" ? "anc" : "pnc"}" style="justify-self:start">Start this visit</a></div>`).join("") : `<p class="empty">No visits due today.</p>`;
  // register
  $("#reg-title").textContent = `Register: ${S.people.length} people`;
  $("#reg").innerHTML = [...S.people].sort((a, b) => (b.last?.at || 0) - (a.last?.at || 0)).map((p) => `<tr>
      <td class="name">${who(p)}<small>${p.sample ? "sample" : "added by a visit"}</small></td>
      <td>${KIND[p.kind]}<small>${status(p)}</small></td>
      <td>${p.last ? ago(p.last.at) : "no visit yet"}</td>
      <td>${p.last ? (p.last.refer ? `<span class="pill refer">refer</span>` : p.last.watch ? `<span class="pill watch">watch</span>` : `<span class="pill ok">fine</span>`) : "—"}</td>
      <td>${p.visits}</td></tr>`).join("");
  firstPaint = false;
}

async function start() {
  try { S = await api("/api/state"); paint(); } catch (e) { $("#vmeta").textContent = e.message; }
  if (!window.EventSource) return;
  const es = new EventSource("/api/stream");
  es.addEventListener("open", () => { $("#live-pill").className = "pill live"; $("#live-pill").textContent = "Live"; });
  es.addEventListener("error", () => { $("#live-pill").className = "pill"; $("#live-pill").textContent = "Reconnecting…"; });
  es.addEventListener("state", (e) => { S = JSON.parse(e.data); paint(); });
  es.addEventListener("visit", (e) => {
    const v = JSON.parse(e.data);
    if (v.refer && "Notification" in window === false) return;
    if (v.refer) { try { const a = new AudioContext(); const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .05; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .18); } catch {} }
  });
  setInterval(() => S && paint(), 60000);
}
start();
</script>
</body>
</html>
